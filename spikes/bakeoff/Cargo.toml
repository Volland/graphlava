[package]
name = "bakeoff"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
redb = "=2.6.4"
# Optional comparison only (needs Rust 1.90+; product MSRV is 1.85 so it cannot ship).
redb4 = { package = "redb", version = "=4.6.0" }
libmdbx = "0.9"
mdbx-sys = "=14.4.0"
sanakirja = "1"
hdrhistogram = "7.5"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"
base64 = "0.22"

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1

[patch.crates-io]
# Vendored sanakirja 1.4.3 with a one-flag patch so commit() can skip msync (NoFlush).
sanakirja = { path = "vendor/sanakirja" }
