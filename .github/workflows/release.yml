name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p meta-core-ffi --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          dir=target/${{ matrix.target }}/release
          out=meta-core-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$out"
          cp LICENSE-MIT LICENSE-APACHE README.md "$out"/
          for f in libmeta_core_ffi.a libmeta_core_ffi.so libmeta_core_ffi.dylib meta_core_ffi.dll meta_core_ffi.dll.lib meta_core_ffi.lib; do
            [ -f "$dir/$f" ] && cp "$dir/$f" "$out"/ || true
          done
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.tar.gz"
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
