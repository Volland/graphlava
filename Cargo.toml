[workspace]
resolver = "3"
members = ["crates/graphlava", "crates/graphlava-cli", "crates/graphlava-ffi", "crates/graphlava-node", "crates/graphlava-py"]
exclude = ["bench"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Volland/graphlava"
description = "A mutable, single-file metagraph database for agent memory"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Doc comments carry typed-graph spec links such as `[[adr:0032]]` and
# `[[09-graphs#Nesting DAG]]`, which `tg trace` reads; rustdoc would treat
# them as intra-doc links to Rust items.
[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
