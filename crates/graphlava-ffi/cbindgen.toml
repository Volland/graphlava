# cbindgen configuration for the graphlava C header (rule `api-ffi-abi`).
# Regenerate from this directory with:
#   cbindgen --config cbindgen.toml --crate graphlava-ffi --output include/graphlava.h
# or run `GRAPHLAVA_BLESS=1 cargo test -p graphlava-ffi --test header`.
language = "C"
include_guard = "GRAPHLAVA_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
header = """/*
 * graphlava C API. SPDX-License-Identifier: MIT OR Apache-2.0
 *
 * Every function except graphlava_version returns a graphlava_status; outputs
 * go through out-parameters. A failing call stores a message readable with
 * graphlava_last_error on the same thread.
 */"""
autogen_warning = "/* Generated by cbindgen from crates/graphlava-ffi/src/lib.rs. Do not edit; see cbindgen.toml. */"

[parse]
parse_deps = false

[enum]
prefix_with_name = false
rename_variants = "None"
